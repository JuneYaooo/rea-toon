[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rea-toon"
version = "0.2.0"
description = "任何短剧，拆成剧本：真人、AI、漫剧、解说，单集或整部剧。"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "requests>=2.28",
  "Pillow>=9.0",
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "rapidocr-onnxruntime>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
rea-toon = "rea_toon.cli:main"

[tool.setuptools.packages.find]
include = ["rea_toon*"]
exclude = ["rea_toon_remake*"]

[tool.pytest.ini_options]
testpaths = ["tests", "remake/tests"]
