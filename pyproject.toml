[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rea-toon"
version = "0.1.0"
description = "Remake AI short dramas: keep plot, shots and emotion; swap characters or the whole art style (gpt-image-2 + MiniMax H3 / Seedance)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "requests>=2.28",
  "PyYAML>=6.0",
  "Pillow>=9.0",
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "rapidocr-onnxruntime>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
rea-toon = "rea_toon.cli:main"

[tool.setuptools.packages.find]
include = ["rea_toon*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
