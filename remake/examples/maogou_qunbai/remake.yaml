# 《裙摆藏不住》第一集 → 全员换成真实的猫猫狗狗
# 剧情、分镜、运镜、情绪、台词和原声全部保留；所有角色（含服务员、顾客）换成写实的猫狗。
# 结尾穿黑西装的"前男友"是姐姐女扮男装（出场时有"温月"名字卡）：她还是那只布偶猫，只是换了衣服。
# 猫狗是"拟人"演法：写实的毛发和动物脸，但像人一样坐椅子、拿菜单、穿原角色的衣服，动作跟原片一致。
# 场景和道具（湖景餐厅、客厅、卧室、菜单、账单、红酒）不变。
# 用法：
#   rea-toon-remake plan work/qunbai remake/examples/maogou_qunbai/remake.yaml
#   rea-toon-remake run  work/qunbai remake/examples/maogou_qunbai/remake.yaml --until frames   # 先审关键帧
#   rea-toon-remake run  work/qunbai remake/examples/maogou_qunbai/remake.yaml --pilot          # 试跑 3 镜
#   rea-toon-remake run  work/qunbai remake/examples/maogou_qunbai/remake.yaml                  # 出全片
name: maogou_qunbai
style:                     # 留空 = 保持原片的写实电影感画风
image_channel: cyber
video_engine: h3local
motion_ref: true
no_motion_ref: "76"         # 1 秒的短镜：参考原片会把原片的人身、人手带回来，首尾帧插值更稳
frames: first_last
lipsync: true
subtitles: reburn
shots: all
workers: 5                 # 5 镜同时在跑：GPU 队列不断档（每段生成后还要检查 30–60s）

cast:
  brother:
    name: 橘子（博美犬）
    look: >-
      一只真实的橘色博美犬，毛发蓬松柔软、照片级写实，圆眼睛亮晶晶，小黑鼻子，表情灵动、爱耍小聪明；
      拟人化：像人一样直立、坐在椅子上，用前爪拿东西、比手势，体型和原角色在画面里一样大。
      日常戏不戴假发；扮女装时头上戴粉红色波浪长假发。
      表情跟着原片走（得意、狡黠、惊讶、嫌弃、无奈），嘴巴按原片闭合或张开，不要总是吐舌头傻笑；
      露出来的手脚都是毛茸茸的狗爪、狗腿（穿高跟鞋也是狗腿），画面里不能有人类的皮肤、手和腿。
    costume: keep          # 扮女装：粉色泡泡袖蓬蓬裙 + 珍珠项链；日常：黄色卡通卫衣
  shen_guanyu:
    name: 沈总（英短银渐层）
    look: >-
      一只真实的银渐层英国短毛猫，银白色短毛末端带淡淡的灰黑色、照片级写实，翡翠绿色圆眼睛，圆脸，
      戴一副金丝细框眼镜，神情沉稳从容、带一点宠溺的浅笑；拟人化：像人一样坐姿端正，用前爪拿菜单、签单。
      露出来的手都是毛茸茸的猫爪，画面里不能有人类的皮肤和手。
    costume: keep          # 浅棕色修身三件套西装和领带；后期白衬衫配黑马甲
  sister:
    name: 温月（布偶猫）
    look: >-
      一只真实的海豹双色布偶猫，长毛蓬松，脸和身体奶白色、耳朵和脸周深棕色，宝石蓝大眼睛，照片级写实，
      漂亮、有点骄纵；整只都是猫：猫头、猫脸、全身长毛，不是人类女性，也不是猫耳少女；
      拟人化：像人一样站立走动、坐沙发、用前爪推银行卡、拿鸡毛掸子；露出来的手脚都是毛茸茸的猫爪。
    costume: keep          # 深色居家真丝睡袍或休闲服；结尾女扮男装假扮前男友时穿黑西装白衬衫（refine 认出是同一人，按镜头换衣服）
  crowd:
    name: 猫狗服务员和顾客
    look: >-
      餐厅里的服务员和其他顾客全部是真实的猫和狗，品种各不相同（柯基、柴犬、金毛、狸花猫、暹罗猫、三花猫等），
      照片级写实毛发；拟人化：像人一样站着端盘子、坐着用餐。端盘子、拿笔、调酒的也是毛茸茸的猫爪狗爪；
      画面里不能出现任何人类，远处背景里的顾客也是猫狗。
    costume: keep          # 服务员穿原来的黑白制服，顾客穿原来的常服

# 逐张关键帧的补充说明
frame_notes:
  59:
    first: 橘子还穿着粉色泡泡袖裙和珍珠项链，但假发在第 48 镜已经扯掉了：背影是自己蓬松的橘色毛，不戴假发（深度拆解 S10 场核对过原片）
  76:
    last: 中间正对镜头、举着红酒杯、穿黑西装白衬衫的是姐姐温月（布偶猫）；左前景背对镜头、穿浅棕色西装的是沈总（银渐层英短），只露出后脑和肩膀。两人的长相和衣服都和这一镜首帧完全一样，不要互换
  32:
    a2: 这是家里客厅的日常戏：橘子（博美犬）穿黄色卡通卫衣和浅蓝牛仔裤，脸上敷着白色面膜，不戴假发、不穿裙子；姐姐（布偶猫）穿黑色长袖上衣和深灰色长裤（不是睡袍；深度拆解 S4 场核对过原片），手拿鸡毛掸子打向橘子

# 镜头中段加关键帧：32 从转场白光里切进客厅，首帧没有人物，中段不给新形象就会照抄原片的真人
anchors:
  32: [0.9, 2.0]
