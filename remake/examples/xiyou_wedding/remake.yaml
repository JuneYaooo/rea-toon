# 《14亿人都来参加婚礼》→ 各路神仙妖怪来参加孙悟空和白骨精的婚礼
# 剧情、分镜、运镜、情绪、台词和原声全部保留；所有角色换成西游记人物，群众换成各路神仙妖怪。
# 场景和道具（停车场、汽车、大锅、宴席、太空舱）不变，神仙妖怪照样开车、吃席，反差即笑点。
# 用法：
#   rea-toon-remake plan work/wedding remake/examples/xiyou_wedding/remake.yaml
#   rea-toon-remake run  work/wedding remake/examples/xiyou_wedding/remake.yaml --until frames   # 先审关键帧
#   rea-toon-remake run  work/wedding remake/examples/xiyou_wedding/remake.yaml                  # 出视频并拼成片
name: xiyou_wedding
style:                     # 留空 = 保持原片的写实电影感画风
image_channel: cyber
video_engine: h3
frames: first_last
lipsync: true
subtitles: reburn
shots: all
workers: 4

cast:
  groom:
    name: 孙悟空
    look: >-
      写实电影质感的齐天大圣孙悟空：猴脸，浅肉色心形面庞，周围一圈浓密的金棕色猴毛，琥珀金色的火眼金睛，
      额头戴金箍，头顶两根长长的凤翅紫金冠翎羽，猴耳；青年男性的人形身材，神情机灵、自信、有点得意。
    costume: keep          # 新郎的黑西装、红色"新郎"胸花
  bride:
    name: 白骨精
    look: >-
      白骨精化身的新娘：二十出头的东方女子，冷艳又灵动，肤色白皙如瓷，银白色长发盘成新娘发髻，
      眉心一点淡红色花钿，眼尾微挑，淡淡的妖异气质但很美，笑起来很甜；表情跟着剧情走，不要总是冷着脸；原创形象，不像任何真人明星。
    costume: keep          # 红色秀禾服、金色凤冠步摇
  cashier:
    name: 太白金星
    look: >-
      白发白眉、雪白长须垂到胸前的慈祥老神仙，面色红润，发髻上插玉簪；原创形象，不像任何真人演员。
    costume: 月白色宽袖道袍，手边放一柄拂尘；保留原角色的黑框眼镜
  parking_attendant:
    name: 猪八戒
    look: >-
      写实电影质感的猪八戒：猪头人身，大耳朵、长嘴、圆肚子，粉灰色皮肤，表情憨厚又有点着急。
    costume: 黑色僧衣外面套原角色的橙色反光背心；对讲机等道具和原画面一样（原画面里没拿就不拿）
  driver:
    name: 牛魔王
    look: 高大魁梧的牛头人身大王，一对弯弯的黑色牛角，鼻环，黑色鬃毛。
    costume: 黑金色铠甲披风
  chef:
    name: 沙僧
    look: >-
      写实电影质感的沙和尚：蓝灰色皮肤，络腮红胡子，光头，脖子上挂一串大佛珠，神情憨厚认真。
    costume: 原角色的白色厨师服和高筒厨师帽，佛珠挂在厨师服外面
  waiter:
    name: 哪吒
    look: >-
      少年哪吒：十五六岁的少年模样，眉心一点红，头顶双丫髻，脖子上戴金色乾坤圈，肩上缠着红色混天绫，
      神情灵动；原创形象，不像任何真人演员。
    costume: 原角色的白色短袖衬衫和红色马甲，混天绫绕在肩上
  server_guy:
    name: 二郎神
    look: >-
      二郎神杨戬：英武的青年神将，额头正中一只竖着的第三只眼，剑眉星目，神情着急；原创形象，不像任何真人演员。
    costume: keep          # 原角色的深蓝色 Polo 衫：天神也得亲自端菜
  mc:
    name: 唐僧
    look: >-
      唐僧：面容清秀端正的中年僧人，光头，眉目慈和，神情庄重又有点啰嗦；原创形象，不像任何真人演员。
    costume: 红色锦斓袈裟，头戴毗卢帽，手持锡杖
  guest_auntie:
    name: 王母娘娘
    look: >-
      雍容华贵的中老年天后，盘起的发髻上戴金凤冠，额间点金色花钿，神情略带不满；原创形象，不像任何真人演员。
    costume: 暗红色绣金凤的宽袖宫装
  astronaut:
    name: 千里眼
    look: >-
      天庭的千里眼神将：青色皮肤，一双金色的大眼睛特别突出，头顶两根小犄角，神情专注。
    costume: keep          # 白色宇航服和宇航头盔：太空拍全家福的笑点保留
  crowd:
    name: 各路神仙妖怪
    look: >-
      西游记里的各路神仙妖怪来吃席：天兵天将（金甲、红缨头盔）、仙女（彩色飘带纱衣）、四海龙王（龙角龙须、黄袍）、
      小妖（虎头、狼头、狐狸耳朵、山羊角）、土地公（白胡子拐杖）、牛头马面、蟠桃园仙童等，人人面带喜气；
      写实电影质感，不是卡通。
    costume: 各自的神话服装，和吃席、排队、端菜等原来的动作搭配
