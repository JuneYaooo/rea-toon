[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rea-toon-remake"
version = "0.2.0"
description = "Remake a locked rea-toon breakdown: swap characters, products or the whole art style (gpt-image-2 + MiniMax H3 / Seedance)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "rea-toon>=0.2",
  "requests>=2.28",
  "PyYAML>=6.0",
  "Pillow>=9.0",
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
]

[project.scripts]
rea-toon-remake = "rea_toon_remake.cli:main"

[tool.setuptools.packages.find]
include = ["rea_toon_remake*"]
